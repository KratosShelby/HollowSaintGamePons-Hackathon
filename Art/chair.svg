<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="seatLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c97d3f"/>
      <stop offset="50%" stop-color="#7a4a2b"/>
      <stop offset="100%" stop-color="#1b1b2f"/>
    </linearGradient>
    <linearGradient id="backLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2e2e52"/>
      <stop offset="100%" stop-color="#0d0d1a"/>
    </linearGradient>
  </defs>

  <!-- ground contact shadow -->
  <ellipse cx="128" cy="208" rx="62" ry="14" fill="#0d0d1a" opacity="0.45"/>

  <!-- legs -->
  <rect x="78" y="156" width="12" height="48" rx="3" fill="#0d0d1a" opacity="0.85"/>
  <rect x="166" y="156" width="12" height="48" rx="3" fill="#0d0d1a" opacity="0.85"/>
  <rect x="92" y="148" width="10" height="36" rx="3" fill="#1b1b2f"/>
  <rect x="154" y="148" width="10" height="36" rx="3" fill="#1b1b2f"/>

  <!-- backrest, rising behind the seat -->
  <rect x="86" y="58" width="84" height="80" rx="10" fill="url(#backLight)" stroke="#0d0d1a" stroke-width="5"/>
  <rect x="100" y="70" width="56" height="10" rx="5" fill="#f2a65a" opacity="0.35"/>

  <!-- seat, catching the key light -->
  <rect x="68" y="134" width="120" height="30" rx="8" fill="url(#seatLight)" stroke="#0d0d1a" stroke-width="5"/>
</svg>
