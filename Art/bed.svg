<svg xmlns="http://www.w3.org/2000/svg" width="320" height="256" viewBox="0 0 320 256">
  <defs>
    <linearGradient id="blanket" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2e2e52"/>
      <stop offset="60%" stop-color="#1b1b2f"/>
      <stop offset="100%" stop-color="#0d0d1a"/>
    </linearGradient>
    <linearGradient id="pillowLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f4e9d8"/>
      <stop offset="100%" stop-color="#c9bda8"/>
    </linearGradient>
    <linearGradient id="frameLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7a4a2b"/>
      <stop offset="100%" stop-color="#0d0d1a"/>
    </linearGradient>
  </defs>

  <!-- ground contact shadow -->
  <ellipse cx="160" cy="236" rx="140" ry="16" fill="#0d0d1a" opacity="0.4"/>

  <!-- headboard -->
  <rect x="24" y="30" width="272" height="42" rx="8" fill="url(#frameLight)" stroke="#0d0d1a" stroke-width="5"/>

  <!-- bed frame / base -->
  <rect x="20" y="66" width="280" height="130" rx="10" fill="url(#frameLight)" stroke="#0d0d1a" stroke-width="5"/>

  <!-- blanket -->
  <rect x="34" y="118" width="252" height="70" rx="8" fill="url(#blanket)"/>
  <!-- blanket fold lines (form-following shading) -->
  <path d="M 50 130 Q 160 140 270 130" stroke="#0d0d1a" stroke-width="3" fill="none" opacity="0.5"/>
  <path d="M 50 150 Q 160 160 270 150" stroke="#0d0d1a" stroke-width="3" fill="none" opacity="0.5"/>

  <!-- pillow -->
  <rect x="40" y="80" width="80" height="40" rx="12" fill="url(#pillowLight)" stroke="#0d0d1a" stroke-width="4"/>

  <!-- amber key-light rim on the near edge of the frame -->
  <rect x="24" y="190" width="272" height="6" rx="3" fill="#f2a65a" opacity="0.3"/>
</svg>
