<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="topLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c97d3f"/>
      <stop offset="45%" stop-color="#7a4a2b"/>
      <stop offset="100%" stop-color="#1b1b2f"/>
    </linearGradient>
    <linearGradient id="legLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7a4a2b"/>
      <stop offset="100%" stop-color="#0d0d1a"/>
    </linearGradient>
  </defs>

  <!-- ground contact shadow -->
  <ellipse cx="128" cy="210" rx="92" ry="18" fill="#0d0d1a" opacity="0.45"/>

  <!-- legs (peeking from under the top, back pair shorter/darker) -->
  <rect x="58" y="150" width="14" height="52" rx="3" fill="url(#legLight)"/>
  <rect x="184" y="150" width="14" height="52" rx="3" fill="url(#legLight)"/>
  <rect x="78" y="140" width="12" height="40" rx="3" fill="#0d0d1a" opacity="0.8"/>
  <rect x="166" y="140" width="12" height="40" rx="3" fill="#0d0d1a" opacity="0.8"/>

  <!-- tabletop, seen from slightly above -->
  <rect x="34" y="70" width="188" height="92" rx="10" fill="url(#topLight)" stroke="#0d0d1a" stroke-width="5"/>
  <!-- front edge thickness -->
  <rect x="34" y="150" width="188" height="14" rx="4" fill="#0d0d1a" opacity="0.6"/>
  <!-- amber rim highlight catching the key light -->
  <rect x="40" y="76" width="176" height="6" rx="3" fill="#f2a65a" opacity="0.55"/>
</svg>
