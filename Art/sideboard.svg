<svg xmlns="http://www.w3.org/2000/svg" width="320" height="200" viewBox="0 0 320 200">
  <defs>
    <linearGradient id="boardLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7a4a2b"/>
      <stop offset="55%" stop-color="#4a2f1c"/>
      <stop offset="100%" stop-color="#0d0d1a"/>
    </linearGradient>
    <radialGradient id="candleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f2a65a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#f2a65a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ground contact shadow -->
  <ellipse cx="160" cy="180" rx="150" ry="14" fill="#0d0d1a" opacity="0.45"/>

  <!-- top surface -->
  <rect x="20" y="80" width="280" height="20" rx="4" fill="#5a3a22" stroke="#0d0d1a" stroke-width="4"/>

  <!-- cabinet body -->
  <rect x="24" y="100" width="272" height="68" rx="8" fill="url(#boardLight)" stroke="#0d0d1a" stroke-width="5"/>

  <!-- door panel lines -->
  <rect x="40" y="112" width="100" height="44" rx="4" fill="none" stroke="#0d0d1a" stroke-width="3" opacity="0.6"/>
  <rect x="180" y="112" width="100" height="44" rx="4" fill="none" stroke="#0d0d1a" stroke-width="3" opacity="0.6"/>

  <!-- legs -->
  <rect x="34" y="166" width="10" height="18" fill="#0d0d1a"/>
  <rect x="276" y="166" width="10" height="18" fill="#0d0d1a"/>

  <!-- the two candles (what the lighting pass actually keys off) -->
  <circle cx="110" cy="54" r="26" fill="url(#candleGlow)"/>
  <rect x="106" y="58" width="8" height="24" fill="#f4e9d8"/>
  <circle cx="110" cy="56" r="4" fill="#f2a65a"/>

  <circle cx="210" cy="54" r="26" fill="url(#candleGlow)"/>
  <rect x="206" y="58" width="8" height="24" fill="#f4e9d8"/>
  <circle cx="210" cy="56" r="4" fill="#f2a65a"/>
</svg>
